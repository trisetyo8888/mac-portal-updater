name: Auto Update MAC Portal

on:
  schedule:
    # Berjalan otomatis setiap hari jam 00:00 UTC (Jam 07:00 WIB)
    - cron: '0 0 * * *'
  workflow_dispatch: # Menyediakan tombol untuk menjalankan manual kapan saja

jobs:
  update-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Izin wajib agar GitHub bisa menulis/push file ke repo Anda

    steps:
    # 1. Mengambil kode dari repositori Anda
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Menyiapkan lingkungan Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Menginstal library yang dibutuhkan skrip
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. Menjalankan skrip update_portal.py Anda
    - name: Run Update Script
      run: python update_portal.py

    # 5. Menyimpan dan mengunggah kembali file mac_playlist.m3u terbaru ke GitHub
    - - name: Commit and Push Changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add Portal.txt update_portal.py  # (Sesuaikan dengan file pendukung Anda)
        git add playlist_*.m3u               # PERBAIKAN: Mengunggah semua playlist terpisah
        git commit -m "Auto-update split MAC playlists" || exit 0
        git push
