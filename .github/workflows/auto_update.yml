name: Auto Update MAC Portal

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-and-push:
    runs-on: ubuntu-latest

    steps:
    # LANGKAH PENTING: Mengunduh file dari repositori ke mesin server GitHub
    - name: Checkout repository
      uses: actions/checkout@v4

    # Menyiapkan Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # Menginstal modul pendukung
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # Menjalankan skrip Anda yang ada di halaman utama
    - name: Run update script
      run: python update_portal.py

    # Menyimpan kembali hasil ekspor data ke GitHub
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add exported_portal.json
        git diff-index --quiet HEAD || git commit -m "Auto-update portal data [skip ci]"
        git push
