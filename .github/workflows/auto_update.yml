name: Auto Update MAC Portal

on:
  schedule:
    # Berjalan otomatis setiap hari jam 00:00 UTC (Bisa disesuaikan menggunakan cron syntax)
    - cron: '0 0 * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan ini secara manual dari tombol di GitHub

jobs:
  update-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout kode dari repositori
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Setup environment Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # 3. Install library yang dibutuhkan
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. Jalankan skrip pembaruan
    - name: Run update script
      run: python update_portal.py

    # 5. Commit dan Push file hasil ekspor kembali ke GitHub
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add exported_portal.json
        git diff-index --quiet HEAD || git commit -m "Auto-update portal data [skip ci]"
        git push
