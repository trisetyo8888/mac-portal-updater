name: Auto Update MAC Portal

on:
  schedule:
    # Berjalan otomatis setiap 6 jam sekali
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run update script
      run: python update_portal.py

    # Langkah menyimpan file yang telah diperbaiki
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if [ -f exported_portal.json ]; then
          git add exported_portal.json
          # Hanya commit jika ada perubahan pada file untuk menghindari error "nothing to commit"
          git diff-index --quiet HEAD || git commit -m "Auto-update portal data [skip ci]"
          git push
        else
          echo "File exported_portal.json tidak ditemukan. Melewati proses push."
        fi
